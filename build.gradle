// Top-level build file for the CDALib test Robot Controller project.
//
// The FtcRobotController / TeamCode modules apply AGP the legacy way (`apply plugin:
// 'com.android.library'`), which requires the Android Gradle Plugin on the buildscript
// classpath here. We pin the SAME AGP version CDALib uses (8.13.2) so the composite build
// (see settings.gradle `includeBuild('../CDALib')`) doesn't load two conflicting AGP versions.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}
