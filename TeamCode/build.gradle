apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // CDALib, resolved from JitPack (repository declared in settings.gradle). Library changes
    // require a new tag in the CDALib repo and a bump of the version below.
    //
    // '@aar' pins the request to the artifact JitPack actually publishes. An Android library
    // produces no plain .jar, and JitPack's handling of a missing artifact is unreliable: it
    // has accepted the connection and then sent nothing at all, stalling a sync until Gradle's
    // socket timeout fires three times over. Artifacts that exist are served in milliseconds
    // even while that is happening.
    //
    // 'transitive = true' is required: artifact-only notation ('@ext') drops the library's own
    // dependencies by default, and PedroPathing, Panels and PhotonFTC all arrive via CDALib.
    implementation('com.github.CDAFM-Robotics:CDALib:v0.2.0@aar') {
        transitive = true
    }
}
