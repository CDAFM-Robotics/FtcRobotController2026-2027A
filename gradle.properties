# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Allow Gradle to use up to 1 GB of RAM
org.gradle.jvmargs=-Xmx1024M -Dfile.encoding=UTF-8

android.nonTransitiveRClass=false

# JitPack black-holes requests for artifacts it cannot build: it accepts the TLS connection and
# then never sends a byte. CDALib publishes only an .aar, so any request for CDALib-<ver>.jar
# (Android Studio's "download sources" artifact query makes one) hangs until Gradle's socket
# timeout fires, three times over. That is a ~90s stall on every sync with Gradle's 30s default.
# Ten seconds is plenty for a healthy repo and caps the damage from a dead one.
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=10000
